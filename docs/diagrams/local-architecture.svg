line points="1050,455 1050,555" fill="none" stroke="#000000" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)" /><polyline points="780,255 840,255 840,595 780,595" fill="none" stroke="#000000" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)" /><polyline points="780,615 930,615" fill="none" stroke="#000000" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)" /><rect x="40" y="190" width="175" height="90" rx="0" fill="#ffffff" stroke="#000000" stroke-width="1.4" /><text x="127.5" y="220.0" font-size="14" fill="#000000" font-weight="600" text-anchor="middle">Report inputs</text><text x="127.5" y="240.0" font-size="12" fill="#000000" font-weight="400" text-anchor="middle">Folder / JSON upload</text><text x="127.5" y="260.0" font-size="12" fill="#000000" font-weight="400" text-anchor="middle">CLI batch</text><rect x="280" y="190" width="200" height="90" rx="0" fill="#ffffff" stroke="#000000" stroke-width="1.4" /><text x="380.0" y="220.0" font-size="14" fill="#000000" font-weight="600" text-anchor="middle">Intake</text><text x="380.0" y="240.0" font-size="12" fill="#000000" font-weight="400" text-anchor="middle">Discovery and retention</text><text x="380.0" y="260.0" font-size="12" fill="#000000" font-weight="400" text-anchor="middle">Persistent watcher queue</text><rect x="560" y="190" width="220" height="90" rx="0" fill="#ffffff" stroke="#000000" stroke-width="1.4" /><text x="670.0" y="220.0" font-size="14" fill="#000000" font-weight="600" text-anchor="middle">Python processing engine</text><text x="670.0" y="240.0" font-size="12" fill="#000000" font-weight="400" text-anchor="middle">Map → normalise → validate</text><text x="670.0" y="260.0" font-size="12" fill="#000000" font-weight="400" text-anchor="middle">Deduplicate and flag</text><rect x="560" y="55" width="220" height="80" rx="0" fill="#ffffff" stroke="#000000" stroke-width="1.4" /><text x="670.0" y="80.0" font-size="14" fill="#000000" font-weight="600" text-anchor="middle">Editable JSON configuration</text><text x="670.0" y="100.0" font-size="12" fill="#000000" font-weight="400" text-anchor="middle">Clinic schemas, tests,</text><text x="670.0" y="120.0" font-size="12" fill="#000000" font-weight="400" text-anchor="middle">units, ranges, medicines</text><rect x="930" y="190" width="240" height="90" rx="0" fill="#ffffff" stroke="#000000" stroke-width="1.4" /><text x="1050.0" y="220.0" font-size="14" fill="#000000" font-weight="600" text-anchor="middle">SQLite</text><text x="1050.0" y="240.0" font-size="12" fill="#000000" font-weight="400" text-anchor="middle">Raw and canonical records</text><text x="1050.0" y="260.0" font-size="12" fill="#000000" font-weight="400" text-anchor="middle">History, reviews, wide view</text><rect x="560" y="375" width="220" height="80" rx="0" fill="#ffffff" stroke="#000000" stroke-width="1.4" /><text x="670.0" y="400.0" font-size="14" fill="#000000" font-weight="600" text-anchor="middle">Failed-file store</text><text x="670.0" y="420.0" font-size="12" fill="#000000" font-weight="400" text-anchor="middle">Original payload and error</text><text x="670.0" y="440.0" font-size="12" fill="#000000" font-weight="400" text-anchor="middle">Retry attempt audit</text><rect x="280" y="375" width="200" height="80" rx="0" fill="#ffffff" stroke="#000000" stroke-width="1.4" /><text x="380.0" y="410.0" font-size="14" fill="#000000" font-weight="600" text-anchor="middle">Inspect and repair</text><text x="380.0" y="430.0" font-size="12" fill="#000000" font-weight="400" text-anchor="middle">Retry original or edited JSON</text><rect x="930" y="375" width="240" height="80" rx="0" fill="#ffffff" stroke="#000000" stroke-width="1.4" /><text x="1050.0" y="410.0" font-size="14" fill="#000000" font-weight="600" text-anchor="middle">Python HTTP API</text><text x="1050.0" y="430.0" font-size="12" fill="#000000" font-weight="400" text-anchor="middle">Loopback-only local service</text><rect x="560" y="555" width="220" height="80" rx="0" fill="#ffffff" stroke="#000000" stroke-width="1.4" /><text x="670.0" y="590.0" font-size="14" fill="#000000" font-weight="600" text-anchor="middle">Operational visibility</text><text x="670.0" y="610.0" font-size="12" fill="#000000" font-weight="400" text-anchor="middle">Logs, metrics, threshold alerts</text><rect x="930" y="555" width="240" height="80" rx="0" fill="#ffffff" stroke="#000000" stroke-width="1.4" /><text x="1050.0" y="590.0" font-size="14" fill="#000000" font-weight="600" text-anchor="middle">Next.js interface</text><text x="1050.0" y="610.0" font-size="12" fill="#000000" font-weight="400" text-anchor="middle">API proxy and operations UI</text><line x1="35" y1="682" x2="1205" y2="682" stroke="#000000" /><text x="35" y="708" font-size="12" fill="#000000" font-weight="400" text-anchor="start">Each file commits atomically. Invalid observations remain available for review; malformed files retain their input for retry.</text></svg>
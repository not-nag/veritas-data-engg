<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="740" viewBox="0 0 1240 740" role="img" aria-label="Onboarding, governance, and observability" font-family="Arial, Helvetica, sans-serif"><title>Onboarding, governance, and observability</title><desc>Proposed operating controls · Configuration-only onboarding is supported locally; production governance requires deployment</desc><rect width="1240" height="740" fill="#ffffff" /><text x="35" y="30" font-size="24" fill="#000000" font-weight="600" text-anchor="start">Onboarding, governance, and observability</text><text x="35" y="52" font-size="13" fill="#000000" font-weight="400" text-anchor="start">Proposed operating controls · Configuration-only onboarding is supported locally; production governance requires deployment</text><text x="40" y="130" font-size="12" fill="#000000" font-weight="600" text-anchor="start">CLINIC ONBOARDING</text><text x="40" y="330" font-size="12" fill="#000000" font-weight="600" text-anchor="start">DATA QUALITY AND GOVERNANCE</text><text x="40" y="530" font-size="12" fill="#000000" font-weight="600" text-anchor="start">MONITORING AND RESPONSE</text><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#000000" /></marker></defs><polyline points="280,197 345,197" fill="none" stroke="#000000" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)" /><polyline points="585,197 650,197" fill="none" stroke="#000000" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)" /><polyline points="890,197 955,197" fill="none" stroke="#000000" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)" /><polyline points="280,397 345,397" fill="none" stroke="#000000" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)" /><polyline points="585,397 650,397" fill="none" stroke="#000000" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)" /><polyline points="890,397 955,397" fill="none" stroke="#000000" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)" /><polyline points="280,597 345,597" fill="none" stroke="#000000" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)" /><polyline points="585,597 650,597" fill="none" stroke="#000000" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)" /><polyline points="890,597 955,597" fill="none" stroke="#000000" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)" /><rect x="40" y="155" width="240" height="85" rx="0" fill="#ffffff" stroke="#000000" stroke-width="1.4" /><text x="160.0" y="192.5" font-size="14" fill="#000000" font-weight="600" text-anchor="middle">Clinic schema and samples</text><text x="160.0" y="212.5" font-size="12" fill="#000000" font-weight="400" text-anchor="middle">Identify version and field paths</text><rect x="345" y="155" width="240" height="85" rx="0" fill="#ffffff" stroke="#000000" stroke-width="1.4" /><text x="465.0" y="192.5" font-size="14" fill="#000000" font-weight="600" text-anchor="middle">Versioned configuration</text><text x="465.0" y="212.5" font-size="12" fill="#000000" font-weight="400" text-anchor="middle">Aliases, units, quality contracts</text><rect x="650" y="155" width="240" height="85" rx="0" fill="#ffffff" stroke="#000000" stroke-width="1.4" /><text x="770.0" y="182.5" font-size="14" fill="#000000" font-weight="600" text-anchor="middle">Validate and review</text><text x="770.0" y="202.5" font-size="12" fill="#000000" font-weight="400" text-anchor="middle">Representative sample tests</text><text x="770.0" y="222.5" font-size="12" fill="#000000" font-weight="400" text-anchor="middle">Domain review of medical rules</text><rect x="955" y="155" width="240" height="85" rx="0" fill="#ffffff" stroke="#000000" stroke-width="1.4" /><text x="1075.0" y="182.5" font-size="14" fill="#000000" font-weight="600" text-anchor="middle">Release mappings</text><text x="1075.0" y="202.5" font-size="12" fill="#000000" font-weight="400" text-anchor="middle">Pin configuration per job</text><text x="1075.0" y="222.5" font-size="12" fill="#000000" font-weight="400" text-anchor="middle">Replay with output history</text><rect x="40" y="355" width="240" height="85" rx="0" fill="#ffffff" stroke="#000000" stroke-width="1.4" /><text x="160.0" y="392.5" font-size="14" fill="#000000" font-weight="600" text-anchor="middle">Immutable source evidence</text><text x="160.0" y="412.5" font-size="12" fill="#000000" font-weight="400" text-anchor="middle">Object generation and clinic ID</text><rect x="345" y="355" width="240" height="85" rx="0" fill="#ffffff" stroke="#000000" stroke-width="1.4" /><text x="465.0" y="392.5" font-size="14" fill="#000000" font-weight="600" text-anchor="middle">Traceable output</text><text x="465.0" y="412.5" font-size="12" fill="#000000" font-weight="400" text-anchor="middle">Stable IDs, timestamps, config hash</text><rect x="650" y="355" width="240" height="85" rx="0" fill="#ffffff" stroke="#000000" stroke-width="1.4" /><text x="770.0" y="382.5" font-size="14" fill="#000000" font-weight="600" text-anchor="middle">Privacy and security</text><text x="770.0" y="402.5" font-size="12" fill="#000000" font-weight="400" text-anchor="middle">Encryption and tokenisation</text><text x="770.0" y="422.5" font-size="12" fill="#000000" font-weight="400" text-anchor="middle">Least-privilege access</text><rect x="955" y="355" width="240" height="85" rx="0" fill="#ffffff" stroke="#000000" stroke-width="1.4" /><text x="1075.0" y="392.5" font-size="14" fill="#000000" font-weight="600" text-anchor="middle">Governed access</text><text x="1075.0" y="412.5" font-size="12" fill="#000000" font-weight="400" text-anchor="middle">Retention, deletion, audit policy</text><rect x="40" y="555" width="240" height="85" rx="0" fill="#ffffff" stroke="#000000" stroke-width="1.4" /><text x="160.0" y="592.5" font-size="14" fill="#000000" font-weight="600" text-anchor="middle">Structured events</text><text x="160.0" y="612.5" font-size="12" fill="#000000" font-weight="400" text-anchor="middle">Run and record correlation IDs</text><rect x="345" y="555" width="240" height="85" rx="0" fill="#ffffff" stroke="#000000" stroke-width="1.4" /><text x="465.0" y="582.5" font-size="14" fill="#000000" font-weight="600" text-anchor="middle">Operational metrics</text><text x="465.0" y="602.5" font-size="12" fill="#000000" font-weight="400" text-anchor="middle">Throughput, errors, lag, p95</text><text x="465.0" y="622.5" font-size="12" fill="#000000" font-weight="400" text-anchor="middle">Coverage and duplicates</text><rect x="650" y="555" width="240" height="85" rx="0" fill="#ffffff" stroke="#000000" stroke-width="1.4" /><text x="770.0" y="582.5" font-size="14" fill="#000000" font-weight="600" text-anchor="middle">Threshold alerts</text><text x="770.0" y="602.5" font-size="12" fill="#000000" font-weight="400" text-anchor="middle">Error rate &gt;1%</text><text x="770.0" y="622.5" font-size="12" fill="#000000" font-weight="400" text-anchor="middle">Queue age / latency breach</text><rect x="955" y="555" width="240" height="85" rx="0" fill="#ffffff" stroke="#000000" stroke-width="1.4" /><text x="1075.0" y="582.5" font-size="14" fill="#000000" font-weight="600" text-anchor="middle">Operational response</text><text x="1075.0" y="602.5" font-size="12" fill="#000000" font-weight="400" text-anchor="middle">Investigate → repair → replay</text><text x="1075.0" y="622.5" font-size="12" fill="#000000" font-weight="400" text-anchor="middle">Track resolution and recovery</text><line x1="35" y1="682" x2="1205" y2="682" stroke="#000000" /><text x="35" y="708" font-size="12" fill="#000000" font-weight="400" text-anchor="start">Coverage target: ≥98% of actual test-name variants within 30 days. Track raw and eligible denominators separately; review precision and exclusions.</text></svg>
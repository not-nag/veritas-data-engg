<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="740" viewBox="0 0 1240 740" role="img" aria-label="Production architecture and resilience" font-family="Arial, Helvetica, sans-serif"><title>Production architecture and resilience</title><desc>Proposed deployment · Managed object storage, event queue, scalable Python workers, and analytical storage</desc><rect width="1240" height="740" fill="#ffffff" /><text x="35" y="30" font-size="24" fill="#000000" font-weight="600" text-anchor="start">Production architecture and resilience</text><text x="35" y="52" font-size="13" fill="#000000" font-weight="400" text-anchor="start">Proposed deployment · Managed object storage, event queue, scalable Python workers, and analytical storage</text><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#000000" /></marker></defs><polyline points="190,235 230,235" fill="none" stroke="#000000" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)" /><polyline points="410,235 460,235" fill="none" stroke="#000000" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)" /><polyline points="640,235 720,235" fill="none" stroke="#000000" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)" /><polyline points="820,135 820,190" fill="none" stroke="#000000" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)" /><polyline points="920,235 980,235" fill="none" stroke="#000000" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)" /><polyline points="1090,280 1090,385" fill="none" stroke="#000000" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)" /><polyline points="760,280 760,325 550,325 550,385" fill="none" stroke="#000000" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)" /><polyline points="460,425 410,425" fill="none" stroke="#000000" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)" /><polyline points="320,385 320,330 440,330 440,255 460,255" fill="none" stroke="#000000" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)" /><polyline points="820,280 820,560" fill="none" stroke="#000000" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)" /><rect x="35" y="190" width="155" height="90" rx="0" fill="#ffffff" stroke="#000000" stroke-width="1.4" /><text x="112.5" y="230.0" font-size="14" fill="#000000" font-weight="600" text-anchor="middle">Clinics</text><text x="112.5" y="250.0" font-size="12" fill="#000000" font-weight="400" text-anchor="middle">JSON reports</text><rect x="230" y="190" width="180" height="90" rx="0" fill="#ffffff" stroke="#000000" stroke-width="1.4" /><text x="320.0" y="220.0" font-size="14" fill="#000000" font-weight="600" text-anchor="middle">Cloud Storage</text><text x="320.0" y="240.0" font-size="12" fill="#000000" font-weight="400" text-anchor="middle">Clinic / date paths</text><text x="320.0" y="260.0" font-size="12" fill="#000000" font-weight="400" text-anchor="middle">Immutable object versions</text><rect x="460" y="190" width="180" height="90" rx="0" fill="#ffffff" stroke="#000000" stroke-width="1.4" /><text x="550.0" y="220.0" font-size="14" fill="#000000" font-weight="600" text-anchor="middle">Pub/Sub</text><text x="550.0" y="240.0" font-size="12" fill="#000000" font-weight="400" text-anchor="middle">Arrival events</text><text x="550.0" y="260.0" font-size="12" fill="#000000" font-weight="400" text-anchor="middle">Buffer burst traffic</text><rect x="720" y="190" width="200" height="90" rx="0" fill="#ffffff" stroke="#000000" stroke-width="1.4" /><text x="820.0" y="220.0" font-size="14" fill="#000000" font-weight="600" text-anchor="middle">Cloud Run workers</text><text x="820.0" y="240.0" font-size="12" fill="#000000" font-weight="400" text-anchor="middle">Parse and standardise</text><text x="820.0" y="260.0" font-size="12" fill="#000000" font-weight="400" text-anchor="middle">Validate and flag</text><rect x="720" y="55" width="200" height="80" rx="0" fill="#ffffff" stroke="#000000" stroke-width="1.4" /><text x="820.0" y="90.0" font-size="14" fill="#000000" font-weight="600" text-anchor="middle">Versioned configuration</text><text x="820.0" y="110.0" font-size="12" fill="#000000" font-weight="400" text-anchor="middle">Reviewed and pinned per job</text><rect x="980" y="190" width="220" height="90" rx="0" fill="#ffffff" stroke="#000000" stroke-width="1.4" /><text x="1090.0" y="220.0" font-size="14" fill="#000000" font-weight="600" text-anchor="middle">BigQuery</text><text x="1090.0" y="240.0" font-size="12" fill="#000000" font-weight="400" text-anchor="middle">Staging → MERGE</text><text x="1090.0" y="260.0" font-size="12" fill="#000000" font-weight="400" text-anchor="middle">Stable-ID deduplication</text><rect x="460" y="385" width="180" height="80" rx="0" fill="#ffffff" stroke="#000000" stroke-width="1.4" /><text x="550.0" y="420.0" font-size="14" fill="#000000" font-weight="600" text-anchor="middle">Dead-letter storage</text><text x="550.0" y="440.0" font-size="12" fill="#000000" font-weight="400" text-anchor="middle">Payload, error, correlation ID</text><rect x="230" y="385" width="180" height="80" rx="0" fill="#ffffff" stroke="#000000" stroke-width="1.4" /><text x="320.0" y="420.0" font-size="14" fill="#000000" font-weight="600" text-anchor="middle">Repair and replay</text><text x="320.0" y="440.0" font-size="12" fill="#000000" font-weight="400" text-anchor="middle">Retain original generation</text><rect x="980" y="385" width="220" height="80" rx="0" fill="#ffffff" stroke="#000000" stroke-width="1.4" /><text x="1090.0" y="410.0" font-size="14" fill="#000000" font-weight="600" text-anchor="middle">Read API and UI</text><text x="1090.0" y="430.0" font-size="12" fill="#000000" font-weight="400" text-anchor="middle">Authenticated operations</text><text x="1090.0" y="450.0" font-size="12" fill="#000000" font-weight="400" text-anchor="middle">Raw / canonical inspection</text><rect x="720" y="560" width="200" height="80" rx="0" fill="#ffffff" stroke="#000000" stroke-width="1.4" /><text x="820.0" y="585.0" font-size="14" fill="#000000" font-weight="600" text-anchor="middle">Cloud Monitoring</text><text x="820.0" y="605.0" font-size="12" fill="#000000" font-weight="400" text-anchor="middle">Queue age, p95, error rate</text><text x="820.0" y="625.0" font-size="12" fill="#000000" font-weight="400" text-anchor="middle">Correlated logs and alerts</text><line x1="35" y1="682" x2="1205" y2="682" stroke="#000000" /><text x="35" y="708" font-size="12" fill="#000000" font-weight="400" text-anchor="start">Design targets: 200k files/day, 2× bursts, p95 ≤15 min, 99.5% availability. Autoscale on queue age/depth; capacity and uptime require validation.</text></svg>